# SSDB 1.9.9 local-development cache configuration.
# Indentation in this file must use tabs.

work_dir = /var/lib/ssdb
pidfile = /tmp/ssdb.pid

server:
	ip: 0.0.0.0
	port: 8888
	slowlog_timeout: 10

replication:
	binlog: no
	sync_speed: -1

logger:
	level: info
	output: stdout

leveldb:
	cache_size: 128
	write_buffer_size: 32
	compaction_speed: 200
	compression: yes
