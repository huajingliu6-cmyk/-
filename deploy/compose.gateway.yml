# Optional edge gateway profile for gzip, keep-alive and upstream timeouts.
# Usage:
#   docker compose -f deploy/compose.remote.yml -f deploy/compose.gateway.yml --profile gateway up -d
#
# Does not expose postgres, SSDB, Go API or blobstore to the public network.

services:
  gateway:
    profiles: ["gateway"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/"]
      interval: 10s
      timeout: 5s
      retries: 10
